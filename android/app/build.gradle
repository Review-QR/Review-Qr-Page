apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

def resolvedStorePath = System.getenv('TRUSTIT_KEYSTORE_PATH') ?: keystoreProperties.getProperty('storeFile')
def resolvedStorePassword = System.getenv('TRUSTIT_STORE_PASSWORD') ?: keystoreProperties.getProperty('storePassword')
def resolvedKeyAlias = System.getenv('TRUSTIT_KEY_ALIAS') ?: keystoreProperties.getProperty('keyAlias')
def resolvedKeyPassword = System.getenv('TRUSTIT_KEY_PASSWORD') ?: keystoreProperties.getProperty('keyPassword')

def resolvedStoreFile = null
if (resolvedStorePath != null && !resolvedStorePath.trim().isEmpty()) {
    def candidate = new File(resolvedStorePath.trim())
    if (candidate.isAbsolute()) {
        resolvedStoreFile = candidate
    } else if (file(resolvedStorePath.trim()).exists()) {
        resolvedStoreFile = file(resolvedStorePath.trim())
    } else {
        resolvedStoreFile = rootProject.file(resolvedStorePath.trim())
    }
}

def hasReleaseSigning = (
    resolvedStoreFile != null &&
    resolvedStoreFile.exists() &&
    resolvedStorePassword != null && !resolvedStorePassword.trim().isEmpty() &&
    resolvedKeyAlias != null && !resolvedKeyAlias.trim().isEmpty() &&
    resolvedKeyPassword != null && !resolvedKeyPassword.trim().isEmpty()
)

android {
    namespace "com.trustit.customer"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.trustit.customer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 19
        versionName "2.7.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:downloads:*.apk'
        }
    }
    flavorDimensions "app"
    productFlavors {
        customer {
            dimension "app"
            applicationId "com.trustit.customer"
            versionCode 20
            versionName "2.7.5"
            manifestPlaceholders = [
                mainActivityClass: "com.trustit.customer.MainActivity"
            ]
        }
        partner {
            dimension "app"
            applicationId "com.trustit.partner"
            versionCode 25
            versionName "3.6.2"
            manifestPlaceholders = [
                mainActivityClass: "com.trustit.partner.MainActivity"
            ]
        }
        rider {
            dimension "app"
            applicationId "com.trustit.rider"
            versionCode 27
            versionName "5.3.1"
            manifestPlaceholders = [
                mainActivityClass: "com.trustit.customer.MainActivity"
            ]
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile resolvedStoreFile
                storePassword resolvedStorePassword
                keyAlias resolvedKeyAlias
                keyPassword resolvedKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                logger.warn('[Trustit] Release signing credentials not configured (set TRUSTIT_KEYSTORE_PATH, TRUSTIT_STORE_PASSWORD, TRUSTIT_KEY_ALIAS, TRUSTIT_KEY_PASSWORD or create android/keystore.properties). Release APK will be unsigned.')
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Uses standard Android debug keystore; never requires or leaks release signing secrets.
        }
    }
    lint {
        checkReleaseBuilds true
        abortOnError true
        disable 'MissingTranslation', 'ExtraTranslation'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
