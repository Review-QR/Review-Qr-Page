



<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160">
  <defs>
    
    <linearGradient id="w_w_left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1565e8"/>
      <stop offset="100%" style="stop-color:#42a5f5"/>
    </linearGradient>
    
    <linearGradient id="w_w_right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00bfa5"/>
      <stop offset="100%" style="stop-color:#64ffda"/>
    </linearGradient>
    
    <linearGradient id="w_w_bridge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5c9fff"/>
      <stop offset="50%" style="stop-color:#2979ff"/>
      <stop offset="100%" style="stop-color:#5c9fff"/>
    </linearGradient>
    
    <linearGradient id="w_w_ck" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#c8e0ff"/>
    </linearGradient>
    <linearGradient id="w_wsp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff"/>
      <stop offset="100%" style="stop-color:#2979ff"/>
    </linearGradient>
    <filter id="w_w_sh"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1565e8" flood-opacity="0.2"/></filter>
    <filter id="w_w_cs"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#002288" flood-opacity="0.3"/></filter>
    <filter id="w_w_glow"><feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="500" height="160" fill="#ffffff" rx="12"/>

  
  <g transform="translate(12, 12)" filter="url(#w_w_sh)">
    
    <rect x="6" y="24" width="18" height="48" rx="9" fill="url(#w_w_left)"/>
    
    <rect x="9" y="26" width="6" height="44" rx="3" fill="#fff" fill-opacity="0.12"/>

    
    <rect x="66" y="24" width="18" height="48" rx="9" fill="url(#w_w_right)"/>
    
    <rect x="69" y="26" width="6" height="44" rx="3" fill="#fff" fill-opacity="0.12"/>

    
    <path d="M 15 40 Q 15 8, 50 8 Q 85 8, 85 40"
          fill="none" stroke="url(#w_w_bridge)" stroke-width="10" stroke-linecap="round"/>

    
    <path d="M 15 40 Q 15 14, 50 14 Q 85 14, 85 40"
          fill="none" stroke="#fff" stroke-width="3" stroke-opacity="0.2" stroke-linecap="round"/>

    
    <g filter="url(#w_w_cs)">
      <path d="M 42 24 L 50 32 L 60 20"
            fill="none" stroke="url(#w_w_ck)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    
    <line x1="22" y1="44" x2="42" y2="30" stroke="#fff" stroke-width="1" stroke-opacity="0.12"/>
    <line x1="78" y1="44" x2="58" y2="30" stroke="#fff" stroke-width="1" stroke-opacity="0.12"/>

    
    <line x1="4" y1="72" x2="86" y2="72" stroke="#738198" stroke-width="1.5" stroke-opacity="0.15" stroke-linecap="round"/>
  </g>

  
  <g transform="translate(84, 6)" filter="url(#w_w_glow)">
    <path d="M8 0C9 3.5,9 6,8 10C7 6.5,7 3.5,8 0Z" fill="url(#w_wsp)"/>
    <path d="M8 0C3 1,0.5 3,0 8C3.5 6.5,6 6.5,11 8C6 6.5,3.5 6.5,0 8C0.5 3,3 1,8 0Z" fill="url(#w_wsp)" transform="rotate(45 8 8)"/>
  </g>

  
  <text x="112" y="62" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="52" font-weight="800" fill="#0a1628" letter-spacing="-2">
    Trust<tspan fill="#1565e8">it</tspan>
  </text>
  <line x1="112" y1="70" x2="280" y2="70" stroke="#1565e8" stroke-width="1.2" stroke-opacity="0.2"/>
  <text x="112" y="86" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="9" font-weight="700" fill="#738198" letter-spacing="5">
    REAL REVIEWS. REAL TRUST.
