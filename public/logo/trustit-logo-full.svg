<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180" width="500" height="180">
  <defs>
    <!-- Shield gradient - deep blue layers -->
    <linearGradient id="shieldGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1565e8;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#0055d4;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1a6fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d5ce0;stop-opacity:1" />
    </linearGradient>
    <!-- Shield bottom teal accent -->
    <linearGradient id="shieldGrad2" x1="0%" y1="60%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6fff;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#00d4c8;stop-opacity:0.6" />
    </linearGradient>
    <!-- Checkmark gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dce8ff;stop-opacity:1" />
    </linearGradient>
    <!-- Sparkle gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00b8d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0055d4;stop-opacity:1" />
    </linearGradient>
    <!-- Shield shadow -->
    <filter id="shieldShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#003178" flood-opacity="0.25"/>
    </filter>
    <!-- Checkmark 3D effect -->
    <filter id="checkShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#003178" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background (white/light for contrast) -->
  <rect width="500" height="180" fill="#ffffff"/>

  <!-- Shield Icon Group -->
  <g transform="translate(10, 5)" filter="url(#shieldShadow)">
    <!-- Main shield shape -->
    <path d="M 20 5
             L 65 5
             Q 78 5 82 18
             Q 95 55 82 82
             Q 78 95 65 95
             L 20 95
             Q 7 95 3 82
             Q -10 55 3 18
             Q 7 5 20 5 Z"
          fill="url(#shieldGrad1)"/>

    <!-- Teal accent on bottom of shield -->
    <path d="M 3 82
             Q 7 95 20 95
             L 65 95
             Q 55 88 42 80
             Q 25 72 3 82 Z"
          fill="url(#shieldGrad2)"/>

    <!-- Inner shield highlight line -->
    <path d="M 18 15
             Q 70 15 73 50
             Q 73 60 68 72"
          fill="none"
          stroke="#ffffff"
          stroke-width="2.5"
          stroke-opacity="0.15"
          stroke-linecap="round"/>

    <!-- Checkmark with 3D effect -->
    <g filter="url(#checkShadow)">
      <path d="M 22 52 L 38 68 L 70 32"
            fill="none"
            stroke="url(#checkGrad)"
            stroke-width="14"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Sparkle/Star -->
  <g transform="translate(92, 6)">
    <path d="M 12 0 C 13.5 5, 13.5 9, 12 14 C 10.5 9, 10.5 5, 12 0 Z"
          fill="url(#sparkleGrad)"/>
    <path d="M 12 0 C 5 1.5, 1.5 5, 0 12 C 5 10.5, 9 10.5, 14 12 C 9 10.5, 5 10.5, 0 12 C 1.5 5, 5 1.5, 12 0 Z"
          fill="url(#sparkleGrad)"
          transform="rotate(45 12 12)"/>
  </g>

  <!-- Brand Name -->
  <text x="115" y="68"
        font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="56"
        font-weight="800"
        fill="#0a1628"
        letter-spacing="-2">
    Trust
    <tspan fill="#1a6fff">it</tspan>
  </text>

  <!-- The "i" dot accent (matching the blue "it") -->
  <!-- The blue dot replaces the "i" dot visually -->

  <!-- Tagline -->
  <text x="115" y="90"
        font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="11"
        font-weight="700"
        fill="#738198"
        letter-spacing="4.5">
    REAL REVIEWS. REAL TRUST.
  </text>
</svg>
