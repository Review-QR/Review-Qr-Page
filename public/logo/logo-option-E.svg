<!-- OPTION E: Letter T Monogram — typographic logo -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 160" width="460" height="160">
  <defs>
    <linearGradient id="e1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e676"/>
      <stop offset="50%" style="stop-color:#00c853"/>
      <stop offset="100%" style="stop-color:#00a040"/>
    </linearGradient>
    <linearGradient id="e2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#69f0ae"/>
      <stop offset="100%" style="stop-color:#00e676"/>
    </linearGradient>
    <linearGradient id="e3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffcc"/>
      <stop offset="100%" style="stop-color:#00e5ff"/>
    </linearGradient>
    <linearGradient id="e4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565e8"/>
      <stop offset="100%" style="stop-color:#0044cc"/>
    </linearGradient>
    <filter id="e_sh"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#00865a" flood-opacity="0.25"/></filter>
    <filter id="e_cs"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00865a" flood-opacity="0.2"/></filter>
    <filter id="e_glow"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="460" height="160" fill="#ffffff" rx="12"/>

  <!-- Stylized T letter with checkmark cutout -->
  <g transform="translate(8,10)" filter="url(#e_sh)">
    <!-- Rounded square background (T container) -->
    <rect x="0" y="0" width="72" height="72" rx="18" fill="url(#e1)"/>

    <!-- Inner lighter border -->
    <rect x="4" y="4" width="64" height="64" rx="15" fill="none" stroke="#fff" stroke-width="1.5" stroke-opacity="0.15"/>

    <!-- The "T" letterform -->
    <!-- Horizontal bar of T -->
    <rect x="10" y="18" width="52" height="14" rx="7" fill="url(#e2)"/>
    <!-- Vertical stem of T -->
    <rect x="26" y="24" width="20" height="38" rx="6" fill="url(#e2)"/>

    <!-- Checkmark cutout/overlay (bottom-right area) -->
    <g filter="url(#e_cs)">
      <path d="M 34 50 L 44 58 L 58 42" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Small accent dot -->
    <circle cx="58" cy="14" r="5" fill="url(#e3)" filter="url(#e_glow)"/>
  </g>

  <!-- Brand Name -->
  <text x="100" y="60" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="46" font-weight="800" fill="#0a1628" letter-spacing="-2">
    Trust<tspan fill="#00a040">it</tspan>
  </text>
  <text x="100" y="80" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#5a8a70" letter-spacing="5">
    REAL REVIEWS. REAL TRUST.
  </text>
</svg>
