<!-- OPTION F: Diamond Premium — luxurious, modern, sharp -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 160" width="460" height="160">
  <defs>
    <linearGradient id="f1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e"/>
      <stop offset="30%" style="stop-color:#283593"/>
      <stop offset="70%" style="stop-color:#3949ab"/>
      <stop offset="100%" style="stop-color:#5c6bc0"/>
    </linearGradient>
    <linearGradient id="f2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd740"/>
      <stop offset="100%" style="stop-color:#ffab00"/>
    </linearGradient>
    <linearGradient id="f3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff"/>
      <stop offset="100%" style="stop-color:#2979ff"/>
    </linearGradient>
    <filter id="f_sh"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a237e" flood-opacity="0.35"/></filter>
    <filter id="f_cs"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a237e" flood-opacity="0.3"/></filter>
    <filter id="f_glow"><feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <!-- Diamond facet gradient (top) -->
    <linearGradient id="f4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7986cb"/>
      <stop offset="100%" style="stop-color:#3949ab"/>
    </linearGradient>
  </defs>
  <rect width="460" height="160" fill="#ffffff" rx="12"/>

  <!-- Diamond shape (rotated square) -->
  <g transform="translate(8,8)" filter="url(#f_sh)">
    <!-- Outer diamond -->
    <polygon points="40,0 80,40 40,80 0,40" fill="url(#f1)"/>

    <!-- Facet lines (diamond cut effect) -->
    <line x1="40" y1="0" x2="40" y2="40" stroke="#fff" stroke-width="0.8" stroke-opacity="0.15"/>
    <line x1="40" y1="40" x2="0" y2="40" stroke="#fff" stroke-width="0.8" stroke-opacity="0.15"/>
    <line x1="40" y1="40" x2="80" y2="40" stroke="#fff" stroke-width="0.8" stroke-opacity="0.15"/>
    <line x1="40" y1="40" x2="40" y2="80" stroke="#fff" stroke-width="0.8" stroke-opacity="0.15"/>
    <!-- Diagonal facets -->
    <line x1="20" y1="20" x2="40" y2="40" stroke="#fff" stroke-width="0.6" stroke-opacity="0.1"/>
    <line x1="60" y1="20" x2="40" y2="40" stroke="#fff" stroke-width="0.6" stroke-opacity="0.1"/>
    <line x1="20" y1="60" x2="40" y2="40" stroke="#fff" stroke-width="0.6" stroke-opacity="0.1"/>
    <line x1="60" y1="60" x2="40" y2="40" stroke="#fff" stroke-width="0.6" stroke-opacity="0.1"/>

    <!-- Top facet (lighter) -->
    <polygon points="40,0 80,40 40,40 0,40" fill="url(#f4)" fill-opacity="0.25"/>

    <!-- Inner diamond (slightly smaller, accent) -->
    <polygon points="40,14 66,40 40,66 14,40" fill="none" stroke="#fff" stroke-width="1" stroke-opacity="0.1"/>

    <!-- Checkmark -->
    <g filter="url(#f_cs)">
      <path d="M 22 40 L 34 52 L 58 24" fill="none" stroke="url(#f2)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Sparkle (gold) -->
  <g transform="translate(88,4)" filter="url(#f_glow)">
    <path d="M12 0C13.5 6,13.5 10,12 16C10.5 10,10.5 6,12 0Z" fill="url(#f2)"/>
    <path d="M12 0C5 1.5,1.5 5,0 12C5 10.5,9 10.5,16 12C9 10.5,5 10.5,0 12C1.5 5,5 1.5,12 0Z" fill="url(#f2)" transform="rotate(45 12 12)"/>
    <circle cx="12" cy="12" r="2" fill="#fff" fill-opacity="0.9"/>
  </g>

  <!-- Brand Name -->
  <text x="100" y="58" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="46" font-weight="800" fill="#0a1628" letter-spacing="-2">
    Trust<tspan fill="#283593">it</tspan>
  </text>
  <text x="100" y="80" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#738198" letter-spacing="5">
    REAL REVIEWS. REAL TRUST.
  </text>
</svg>
