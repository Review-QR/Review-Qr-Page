<!-- OPTION C: QR-code inspired — merges QR pattern with shield shape -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 160" width="460" height="160">
  <defs>
    <linearGradient id="c1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565e8"/>
      <stop offset="50%" style="stop-color:#0044cc"/>
      <stop offset="100%" style="stop-color:#002db3"/>
    </linearGradient>
    <linearGradient id="c2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff"/>
      <stop offset="100%" style="stop-color:#00b8d4"/>
    </linearGradient>
    <linearGradient id="c3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#c8e6ff"/>
    </linearGradient>
    <linearGradient id="csp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff"/>
      <stop offset="100%" style="stop-color:#2979ff"/>
    </linearGradient>
    <filter id="c_sh"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#002db3" flood-opacity="0.3"/></filter>
    <filter id="c_cs"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#002288" flood-opacity="0.3"/></filter>
    <filter id="c_glow"><feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="460" height="160" fill="#ffffff" rx="12"/>

  <!-- Shield with QR-inspired geometric pattern overlay -->
  <g transform="translate(8,8)" filter="url(#c_sh)">
    <!-- Main shield -->
    <path d="M 18 3 L 58 3 Q 70 3 73 14 Q 82 42 73 70 Q 70 81 58 81 L 18 81 Q 6 81 3 70 Q -6 42 3 14 Q 6 3 18 3 Z" fill="url(#c1)"/>

    <!-- QR-style corner markers (3 corners) -->
    <!-- Top-left corner -->
    <rect x="8" y="12" width="14" height="14" rx="2" fill="#fff" fill-opacity="0.2"/>
    <rect x="10" y="14" width="10" height="10" rx="1" fill="#fff" fill-opacity="0.35"/>
    <rect x="12" y="16" width="6" height="6" rx="1" fill="#fff" fill-opacity="0.6"/>

    <!-- Top-right corner -->
    <rect x="54" y="12" width="14" height="14" rx="2" fill="#fff" fill-opacity="0.2"/>
    <rect x="56" y="14" width="10" height="10" rx="1" fill="#fff" fill-opacity="0.35"/>
    <rect x="58" y="16" width="6" height="6" rx="1" fill="#fff" fill-opacity="0.6"/>

    <!-- Bottom-left corner -->
    <rect x="8" y="58" width="14" height="14" rx="2" fill="#fff" fill-opacity="0.2"/>
    <rect x="10" y="60" width="10" height="10" rx="1" fill="#fff" fill-opacity="0.35"/>
    <rect x="12" y="62" width="6" height="6" rx="1" fill="#fff" fill-opacity="0.6"/>

    <!-- Center area: Checkmark -->
    <g filter="url(#c_cs)">
      <path d="M 20 48 L 34 62 L 56 32" fill="none" stroke="url(#c3)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- QR pattern dots scattered in background (subtle) -->
    <rect x="28" y="18" width="3" height="3" rx="0.5" fill="#fff" fill-opacity="0.15"/>
    <rect x="34" y="24" width="3" height="3" rx="0.5" fill="#fff" fill-opacity="0.12"/>
    <rect x="42" y="18" width="3" height="3" rx="0.5" fill="#fff" fill-opacity="0.12"/>
    <rect x="28" y="30" width="3" height="3" rx="0.5" fill="#fff" fill-opacity="0.1"/>
    <rect x="46" y="28" width="3" height="3" rx="0.5" fill="#fff" fill-opacity="0.1"/>
    <rect x="18" y="42" width="3" height="3" rx="0.5" fill="#fff" fill-opacity="0.12"/>
    <rect x="14" y="50" width="3" height="3" rx="0.5" fill="#fff" fill-opacity="0.1"/>
    <rect x="58" y="44" width="3" height="3" rx="0.5" fill="#fff" fill-opacity="0.12"/>
  </g>

  <!-- Sparkle (with glow) -->
  <g transform="translate(80,3)" filter="url(#c_glow)">
    <path d="M12 0C13.5 6,13.5 10,12 16C10.5 10,10.5 6,12 0Z" fill="url(#csp)"/>
    <path d="M12 0C5 1.5,1.5 5,0 12C5 10.5,9 10.5,16 12C9 10.5,5 10.5,0 12C1.5 5,5 1.5,12 0Z" fill="url(#csp)" transform="rotate(45 12 12)"/>
    <circle cx="12" cy="12" r="2" fill="#fff" fill-opacity="0.9"/>
  </g>

  <!-- Brand Name -->
  <text x="100" y="58" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="46" font-weight="800" fill="#0a1628" letter-spacing="-2">
    Trust<tspan fill="#1565e8">it</tspan>
  </text>
  <text x="100" y="80" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#738198" letter-spacing="5">
    REAL REVIEWS. REAL TRUST.
  </text>
</svg>
