<!-- OPTION O: Orbital System — three dots orbiting a central trust core -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 160" width="460" height="160">
  <defs>
    <linearGradient id="o_core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5c9fff"/>
      <stop offset="100%" style="stop-color:#003399"/>
    </linearGradient>
    <linearGradient id="o_core_inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="o_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565e8"/>
      <stop offset="100%" style="stop-color:#0044cc"/>
    </linearGradient>
    <linearGradient id="o_green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00bfa5"/>
      <stop offset="100%" style="stop-color:#00806a"/>
    </linearGradient>
    <linearGradient id="o_orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffab00"/>
      <stop offset="100%" style="stop-color:#ff6d00"/>
    </linearGradient>
    <linearGradient id="o_ck" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#c8e0ff"/>
    </linearGradient>
    <linearGradient id="osp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff"/>
      <stop offset="100%" style="stop-color:#2979ff"/>
    </linearGradient>
    <filter id="o_sh"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#003399" flood-opacity="0.25"/></filter>
    <filter id="o_core_glow"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="o_glow"><feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="460" height="160" fill="#ffffff" rx="12"/>

  <!-- Orbital rings (dashed circles) -->
  <g transform="translate(8,8)" opacity="0.12">
    <circle cx="42" cy="42" r="36" fill="none" stroke="#1565e8" stroke-width="1.2" stroke-dasharray="5 3"/>
    <circle cx="42" cy="42" r="28" fill="none" stroke="#00a085" stroke-width="1" stroke-dasharray="4 3" transform="rotate(60 42 42)"/>
  </g>

  <!-- Central Trust Core (glowing sphere) -->
  <g transform="translate(8,8)" filter="url(#o_sh)">
    <circle cx="42" cy="42" r="28" fill="url(#o_core)"/>
    <!-- Inner gradient -->
    <circle cx="42" cy="42" r="22" fill="url(#o_core_inner)" fill-opacity="0.5"/>
    <!-- Highlight -->
    <ellipse cx="37" cy="35" rx="10" ry="7" fill="#fff" fill-opacity="0.1"/>
    <!-- Checkmark -->
    <g filter="url(#o_glow)">
      <path d="M 28 44 L 38 54 L 56 30" fill="none" stroke="url(#o_ck)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Check highlight -->
    <path d="M 30 43 L 36 49" fill="none" stroke="#fff" stroke-width="2.5" stroke-opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- Three orbiting dots with orbital trails -->
  <!-- Dot 1 (top - Merchant/Blue) -->
  <g filter="url(#o_core_glow)">
    <circle cx="42" cy="8" r="7" fill="url(#o_blue)"/>
    <circle cx="42" cy="8" r="3" fill="#fff" fill-opacity="0.4"/>
  </g>
  <!-- Trail -->
  <line x1="42" y1="14" x2="42" y2="22" stroke="#1565e8" stroke-width="1.5" stroke-opacity="0.15" stroke-linecap="round"/>

  <!-- Dot 2 (bottom-right - Customer/Green) -->
  <g filter="url(#o_core_glow)">
    <circle cx="72" cy="56" r="7" fill="url(#o_green)"/>
    <circle cx="72" cy="56" r="3" fill="#fff" fill-opacity="0.4"/>
  </g>
  <!-- Trail -->
  <line x1="66" y1="52" x2="58" y2="48" stroke="#00bfa5" stroke-width="1.5" stroke-opacity="0.15" stroke-linecap="round"/>

  <!-- Dot 3 (bottom-left - Reviews/Orange) -->
  <g filter="url(#o_core_glow)">
    <circle cx="12" cy="56" r="7" fill="url(#o_orange)"/>
    <circle cx="12" cy="56" r="3" fill="#fff" fill-opacity="0.4"/>
  </g>
  <!-- Trail -->
  <line x1="18" y1="52" x2="26" y2="48" stroke="#ffab00" stroke-width="1.5" stroke-opacity="0.15" stroke-linecap="round"/>

  <!-- Connection lines (subtle) -->
  <line x1="42" y1="15" x2="42" y2="30" stroke="#1565e8" stroke-width="0.8" stroke-opacity="0.12" stroke-dasharray="2 2"/>
  <line x1="66" y1="52" x2="54" y2="46" stroke="#00bfa5" stroke-width="0.8" stroke-opacity="0.12" stroke-dasharray="2 2"/>
  <line x1="19" y1="52" x2="30" y2="46" stroke="#ffab00" stroke-width="0.8" stroke-opacity="0.12" stroke-dasharray="2 2"/>

  <!-- Sparkle -->
  <g transform="translate(82,4)" filter="url(#o_glow)">
    <path d="M8 0C9 3.5,9 6,8 10C7 6.5,7 3.5,8 0Z" fill="url(#osp)"/>
    <path d="M8 0C3 1,0.5 3,0 8C3.5 6.5,6 6.5,11 8C6 6.5,3.5 6.5,0 8C0.5 3,3 1,8 0Z" fill="url(#osp)" transform="rotate(45 8 8)"/>
  </g>

  <!-- Brand Name -->
  <text x="100" y="58" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="46" font-weight="800" fill="#0a1628" letter-spacing="-2">
    Trust<tspan fill="#1565e8">it</tspan>
  </text>
  <text x="100" y="78" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#738198" letter-spacing="5">
    REAL REVIEWS. REAL TRUST.
  </text>
</svg>
