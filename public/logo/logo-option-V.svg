



<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160">
  <defs>
    
    <linearGradient id="v_v_ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565e8"/>
      <stop offset="50%" style="stop-color:#0d47a1"/>
      <stop offset="100%" style="stop-color:#002971"/>
    </linearGradient>
    
    <linearGradient id="v_v_inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e3f2fd"/>
    </linearGradient>
    
    <linearGradient id="v_v_ck" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1565e8"/>
      <stop offset="100%" style="stop-color:#0044cc"/>
    </linearGradient>
    
    <linearGradient id="v_v_sp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff"/>
      <stop offset="100%" style="stop-color:#2979ff"/>
    </linearGradient>
    <filter id="v_v_sh"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#002971" flood-opacity="0.3"/></filter>
    <filter id="v_v_cs"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#002288" flood-opacity="0.25"/></filter>
    <filter id="v_v_glow"><feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="500" height="160" fill="#ffffff" rx="12"/>

  
  <g transform="translate(12, 12)" filter="url(#v_v_sh)">
    
    <circle cx="50" cy="50" r="46" fill="url(#v_v_ring)"/>

    
    <circle cx="50" cy="50" r="40" fill="none" stroke="#fff" stroke-width="2.5" stroke-opacity="0.9"/>

    
    <circle cx="50" cy="50" r="37" fill="url(#v_v_inner)"/>

    
    <circle cx="50" cy="16" r="1.8" fill="#1565e8" fill-opacity="0.3"/>
    <circle cx="50" cy="84" r="1.8" fill="#1565e8" fill-opacity="0.3"/>
    <circle cx="16" cy="50" r="1.8" fill="#1565e8" fill-opacity="0.3"/>
    <circle cx="84" cy="50" r="1.8" fill="#1565e8" fill-opacity="0.3"/>

    
    <path id="v_v_topArc" d="M 18 50 A 32 32 0 0 1 82 50" fill="none"/>
    <text font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="8.5" font-weight="800" fill="#0d47a1" letter-spacing="4">
      <textPath href="#v_v_topArc" startOffset="12%" text-anchor="middle">TRUSTIT</textPath>
    </text>

    
    <path id="v_v_botArc" d="M 82 50 A 32 32 0 0 1 18 50" fill="none"/>
    <text font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="7" font-weight="600" fill="#1565e8" fill-opacity="0.6" letter-spacing="3">
      <textPath href="#v_v_botArc" startOffset="18%" text-anchor="middle">VERIFIED LOCAL</textPath>
    </text>

    
    <path d="M 50 26 L 58 26 Q 62 26 63 30 Q 67 42 63 52 Q 62 56 58 56 L 50 56 Q 42 56 41 52 Q 37 42 41 30 Q 42 26 50 26 Z"
          fill="#1565e8" fill-opacity="0.1"/>

    
    <g filter="url(#v_v_cs)">
      <path d="M 40 48 L 48 56 L 62 40" fill="none" stroke="url(#v_v_ck)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    
    <g transform="translate(47, 14)" filter="url(#v_v_glow)">
      <path d="M4 0C4.5 2,4.5 3.5,4 5C3.5 3.5,3.5 2,4 0Z" fill="url(#v_v_sp)"/>
      <path d="M4 0C1.5 0.5,0.5 2,0 4C2 3.5,3 3.5,5 4C3 3.5,2 3.5,0 4C0.5 2,1.5 0.5,4 0Z" fill="url(#v_v_sp)" transform="rotate(45 4 4)"/>
    </g>
  </g>

  
  <text x="112" y="62" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="52" font-weight="800" fill="#0a1628" letter-spacing="-2">
    Trust<tspan fill="#1565e8">it</tspan>
  </text>
  <line x1="112" y1="70" x2="280" y2="70" stroke="#1565e8" stroke-width="1.2" stroke-opacity="0.2"/>
  <text x="112" y="86" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="9" font-weight="700" fill="#738198" letter-spacing="5">
    REAL REVIEWS. REAL TRUST.
  </text>
</svg>
