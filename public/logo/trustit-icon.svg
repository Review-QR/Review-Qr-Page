<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="shieldGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1565e8;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#0055d4;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1a6fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d5ce0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGrad2" x1="0%" y1="60%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6fff;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#00d4c8;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dce8ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00b8d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0055d4;stop-opacity:1" />
    </linearGradient>
    <filter id="shieldShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#003178" flood-opacity="0.3"/>
    </filter>
    <filter id="checkShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#003178" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="160" height="160" fill="#ffffff"/>

  <!-- Shield Icon (centered) -->
  <g transform="translate(8, 5)" filter="url(#shieldShadow)">
    <path d="M 55 10 L 108 10 Q 124 10 129 26 Q 144 68 129 110 Q 124 126 108 126 L 55 126 Q 39 126 34 110 Q 19 68 34 26 Q 39 10 55 10 Z"
          fill="url(#shieldGrad1)" />

    <!-- Teal accent at bottom -->
    <path d="M 34 82 Q 39 100 55 110 Q 72 118 95 110 L 108 126 Q 80 118 55 126 Q 39 126 34 110 Q 28 95 34 82 Z"
          fill="url(#shieldGrad2)"/>

    <!-- Highlight line -->
    <path d="M 53 15 Q 100 15 104 50 Q 104 62 98 72"
          fill="none" stroke="#fff" stroke-width="2" stroke-opacity="0.12" stroke-linecap="round"/>

    <!-- Checkmark -->
    <g filter="url(#checkShadow)">
      <path d="M 48 58 L 68 78 L 108 34"
            fill="none"
            stroke="url(#checkGrad)"
            stroke-width="12"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Sparkle -->
  <g transform="translate(115, 3)">
    <path d="M 10 0 C 11.5 5, 11.5 9, 10 14 C 8.5 9, 8.5 5, 10 0 Z" fill="url(#sparkleGrad)"/>
    <path d="M 10 0 C 3 1.5, 0.5 5, 0 10 C 5 8.5, 9 8.5, 14 10 C 9 8.5, 5 8.5, 0 10 C 0.5 5, 3 1.5, 10 0 Z" fill="url(#sparkleGrad)" transform="rotate(45 10 10)"/>
  </g>
</svg>
