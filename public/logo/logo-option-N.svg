<!-- OPTION N: Chain Links — three rings interlocked like a chain -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 160" width="460" height="160">
  <defs>
    <linearGradient id="n1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42a5f5"/>
      <stop offset="100%" style="stop-color:#1565e8"/>
    </linearGradient>
    <linearGradient id="n2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#69f0ae"/>
      <stop offset="100%" style="stop-color:#00897b"/>
    </linearGradient>
    <linearGradient id="n3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffab40"/>
      <stop offset="100%" style="stop-color:#ff6d00"/>
    </linearGradient>
    <linearGradient id="nck" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e8f5e9"/>
    </linearGradient>
    <linearGradient id="nsp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff"/>
      <stop offset="100%" style="stop-color:#2979ff"/>
    </linearGradient>
    <filter id="n_sh"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1565e8" flood-opacity="0.2"/></filter>
    <filter id="n_glow"><feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="460" height="160" fill="#ffffff" rx="12"/>

  <!-- Background ring hints -->
  <circle cx="42" cy="48" r="46" fill="none" stroke="#e3f2fd" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.5"/>

  <!-- Three interlocked chain rings (horizontal chain) -->
  <g transform="translate(8,8)" filter="url(#n_sh)">
    <!-- Left ring (Blue - Merchant) — horizontal orientation -->
    <g>
      <ellipse cx="26" cy="42" rx="17" ry="20" fill="none" stroke="url(#n1)" stroke-width="10" stroke-opacity="0.9"/>
      <ellipse cx="26" cy="42" rx="10" ry="13" fill="#ffffff"/>
    </g>

    <!-- Right ring (Green - Customer) — horizontal orientation, interlocked with left -->
    <g>
      <ellipse cx="58" cy="42" rx="17" ry="20" fill="none" stroke="url(#n2)" stroke-width="10" stroke-opacity="0.9"/>
      <ellipse cx="58" cy="42" rx="10" ry="13" fill="#ffffff"/>
    </g>

    <!-- Center ring (Orange - Trust) — vertical orientation, passing through both -->
    <g>
      <ellipse cx="42" cy="56" rx="17" ry="12" fill="none" stroke="url(#n3)" stroke-width="10" stroke-opacity="0.9"/>
      <ellipse cx="42" cy="56" rx="10" ry="6" fill="#ffffff"/>
    </g>

    <!-- Center checkmark (the trust value) -->
    <g filter="url(#n_glow)">
      <path d="M 38 42 L 43 47 L 48 40" fill="none" stroke="#00897b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Decorative floating elements -->
  <g transform="translate(74,10)">
    <circle cx="6" cy="6" r="3" fill="url(#nsp)" filter="url(#n_glow)"/>
    <circle cx="14" cy="14" r="2" fill="#ff8f00" opacity="0.6"/>
    <circle cx="2" cy="16" r="2.5" fill="#00a085" opacity="0.6"/>
  </g>

  <!-- Brand Name -->
  <text x="100" y="58" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="46" font-weight="800" fill="#0a1628" letter-spacing="-2">
    Trust<tspan fill="#1565e8">it</tspan>
  </text>
  <text x="100" y="78" font-family="'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#738198" letter-spacing="5">
    REAL REVIEWS. REAL TRUST.
  </text>
</svg>
