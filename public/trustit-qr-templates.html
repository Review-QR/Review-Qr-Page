<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trustit QR Templates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,"Segoe UI",system-ui,sans-serif;background:linear-gradient(180deg,#f3f6fd,#eef2fb);padding:36px 16px;color:#14171f}
.row{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;align-items:flex-start}
.col{display:flex;flex-direction:column;align-items:center;gap:20px}

/* ---------- card base ---------- */
.card{--b1:#1456c8;--b2:#2f8cf5;--word:#143a8f;--chk:#fff;
  position:relative;width:350px;height:662px;border-radius:36px;background:#fff;overflow:hidden;
  text-align:center;padding-top:38px;box-shadow:0 0 0 5px rgba(255,255,255,.9),0 10px 26px rgba(40,60,120,.2)}
.card>*{position:relative;z-index:1}
.card::before,.card::after{content:"";position:absolute;z-index:0}

/* logo */
.logo{display:flex;align-items:center;justify-content:center;gap:7px;height:72px}
.logo svg{width:56px;height:61px}
.logo b{font-size:46px;font-weight:800;letter-spacing:-1.6px;color:var(--word);line-height:1}
.sub{font-size:16px;font-weight:500;color:#1b1f2a;margin-top:6px}
.rule{width:52px;height:3px;border-radius:3px;background:#f26a1b;margin:12px auto 0;position:relative}
.rule+.name{margin-top:14px}
.name{font-size:29px;font-weight:700;letter-spacing:-.5px;margin-top:26px;color:#14171f;padding:0 30px;white-space:nowrap;overflow:hidden}
.tag{font-size:16px;font-weight:500;margin-top:8px;color:#1b1f2a;padding:0 30px;white-space:nowrap;overflow:hidden}
.div{width:80%;height:1px;background:#dde2ee;margin:20px auto 26px;position:relative}
.div::after{content:"";position:absolute;left:50%;top:-2px;width:5px;height:5px;margin-left:-2px;border-radius:50%;background:#c4cbe0}

/* qr */
.qrbox{position:relative;width:212px;height:212px;margin:0 auto}
.qrbox .qr img,.qrbox .qr canvas{width:212px!important;height:212px!important;display:block}
.qrlogo{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;background:#fff;border-radius:16px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.qrlogo svg{width:34px;height:37px}

/* texts + buttons */
.scan{font-size:20px;font-weight:600;margin-top:18px;letter-spacing:-.3px;color:#14171f}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;width:282px;margin-top:8px;border-radius:99px;
  background:linear-gradient(180deg,#ff7a22,#ee5a0c);color:#fff;font-size:18px;font-weight:500;box-shadow:0 3px 8px rgba(238,90,12,.35)}
.btn i{width:22px;height:22px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center}
.btn i svg{width:13px;height:13px}
.g{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:44px;padding:0 24px;margin-top:10px;border-radius:99px;
  background:#fff;border:1px solid #e5e8f0;box-shadow:0 3px 9px rgba(30,40,80,.14);font-size:20px;font-weight:500;letter-spacing:-.4px;color:#1d2230}
.g svg{width:26px;height:26px}.g b{font-weight:700}
.scan+.g{margin-top:5px}

/* powered by */
.pow{position:absolute;left:0;right:0;bottom:25px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:17px;font-weight:500;color:#1d2230;--b1:#1456c8;--b2:#2f8cf5;--word:#143a8f}
.pow svg{width:28px;height:30px}.pow b{font-size:23px;font-weight:800;letter-spacing:-.8px;color:var(--word)}

/* ---------- Template 01 ---------- */
.t1{background:
  radial-gradient(circle at 100% 0,#f23a2c 0 55px,rgba(242,58,44,0) 135px),
  radial-gradient(circle at 0 0,#fcb913 0 70px,rgba(252,185,19,0) 210px),
  radial-gradient(ellipse 150px 70px at 0 100%,#2fa655 0 60%,rgba(47,166,85,0) 100%),
  radial-gradient(ellipse 170px 90px at 100% 100%,#1f7ae8 0 50%,rgba(31,122,232,0) 100%),
  linear-gradient(180deg,#fff3e1,#fff8ef 55%,#fff 80%)}
.t1::after{left:0;right:0;bottom:0;height:78px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.55) 55%,rgba(255,255,255,.2));border-radius:60% 40% 0 0/40px 30px 0 0}

/* ---------- Template 02 ---------- */
.t2{background:linear-gradient(135deg,#0d63de,#0a4cc2);padding-top:56px}
.t2::before{inset:18px;border-radius:26px;background:linear-gradient(180deg,#fff 0,#fff 74%,#e8f1ff 100%)}
.t2::after{left:18px;right:18px;bottom:18px;height:80px;border-radius:0 0 26px 26px;background:radial-gradient(ellipse 260px 60px at 50% 120%,#bcd7ff,rgba(188,215,255,0))}
.t2 .name{font-size:26px;margin-top:0}
.t2 .div{display:none}
.t2 .qrbox{margin-top:30px}
.t2 .g{height:40px;font-size:19px;padding:0 22px;margin-top:11px}
.t2 .pow{bottom:30px}

/* ---------- Template 03 ---------- */
.t3::before{left:-10%;top:-74px;width:120%;height:164px;background:linear-gradient(90deg,#e9261b 0,#e9261b 52%,#1366d8 52%);border-radius:0 0 50% 50%/0 0 100px 80px}
.t3::after{left:-10%;bottom:-54px;width:120%;height:130px;background:linear-gradient(90deg,#fbbc04 0,#fbbc04 42%,#1fa24a 42%);border-radius:90px 70px 0 0/60px 50px 0 0}

/* ---------- Template 04 ---------- */
.t4{background:
  radial-gradient(circle at 0 0,#fcc20c 0 95px,rgba(252,194,12,0) 96px),
  radial-gradient(circle at 100% 0,#ee2b22 0 110px,rgba(238,43,34,0) 111px),
  radial-gradient(circle at 0 100%,#1fa64a 0 105px,rgba(31,166,74,0) 106px),
  radial-gradient(circle at 100% 100%,#1561dc 0 95px,rgba(21,97,220,0) 96px),#fff}

/* ---------- Template 05 ---------- */
.t5{--b1:#e8530a;--b2:#ff9a3c;--word:#d9480f;
  background:linear-gradient(180deg,#ff9248 0,#ffd9bd 17%,#fff1e5 36%,#fff8f2 70%,#ffe6d2 100%)}
.t5::after{left:0;right:0;bottom:0;height:86px;background:linear-gradient(180deg,#ff8a2b,#f2600a)}
.t5 .logo+.rule{margin-top:6px}
.t5 .rule{width:110px;height:2px;background:linear-gradient(90deg,transparent,#f26a1b 30%,#f26a1b 70%,transparent)}
.t5 .name{margin-top:14px}
.t5 .tag{font-size:15px;margin-top:6px}
.t5 .qrbox{margin-top:18px}
.t5 .qrbox::before{content:"";position:absolute;inset:-11px;border-radius:15px;background:#fff7f0;z-index:-1}
.t5 .btn{margin-top:20px;width:310px}
.t5 .g{height:40px;font-size:19px;margin-top:12px}
.t5 .pow{color:#fff;bottom:30px;--b1:#fff;--b2:#ffe3cc;--word:#fff;--chk:#f26a10}

/* labels under cards */
.lab{padding:11px 36px;border-radius:99px;font-size:26px;font-weight:700;letter-spacing:-.4px}
.l1{background:#fde4cf;color:#b8330c}.l2{background:#d6e8ff;color:#12295e}.l3{background:#d8f1d8;color:#13351f}.l4{background:#e6dcfb;color:#2a1747}.l5{background:#fde4cf;color:#1a1a1a}
</style>
</head>
<body>

<!-- shared SVG symbols: colours come from --b1 / --b2 / --chk of the parent -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="shield" viewBox="0 0 64 70">
    <path style="fill:var(--b1)" d="M32 5 6 15v18c0 17 11 29 26 35z"/>
    <path style="fill:var(--b2)" d="M32 5l26 10v18c0 17-11 29-26 35z"/>
    <path d="M19 35l9.5 9.5L46 25" fill="none" style="stroke:var(--chk,#fff)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path style="fill:var(--b2)" d="M55 0l2.2 6.3L63.5 8.5l-6.3 2.2L55 17l-2.2-6.3L46.5 8.5l6.3-2.2z"/>
  </symbol>
  <symbol id="gl" viewBox="0 0 48 48">
    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
  </symbol>
</svg>

<div class="row" id="row"></div>

<script>
(function(){
var shield='<svg><use href="#shield"/></svg>';
var logo='<div class="logo">'+shield+'<b>Trustit</b></div>';
var google='<div class="g"><svg><use href="#gl"/></svg><span>Also Review on <b>Google</b></span></div>';
var pow='<div class="pow">Powered by '+shield+'<b>Trustit</b></div>';
var btn='<div class="btn"><i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#ee5a0c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></i>Scan to Review on Trustit</div>';
var qr='<div class="qrbox"><div class="qr"></div><div class="qrlogo">'+shield+'</div></div>';
var scan='<div class="scan">Scan to Review on Trustit</div>';
var gap='<div style="height:6px"></div>';
var T=[
 {c:"t1",l:"l1",n:"Template 01",h:logo+'<div class="name"></div><div class="div"></div>'+qr+scan+google+pow},
 {c:"t2",l:"l2",n:"Template 02",h:logo+'<div class="sub">Review &amp; Support Local Business</div><div class="rule"></div><div class="name"></div>'+qr+btn+google+pow},
 {c:"t3",l:"l3",n:"Template 03",h:gap+logo+'<div class="name"></div><div class="div"></div>'+qr+scan+google+pow},
 {c:"t4",l:"l4",n:"Template 04",h:gap+logo+'<div class="name"></div><div class="div"></div>'+qr+scan+google+pow},
 {c:"t5",l:"l5",n:"Template 05",h:logo+'<div class="rule"></div><div class="name"></div><div class="tag"></div>'+qr+btn+google+pow}
];

function fit(el){var s=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth&&s>13){s-=1;el.style.fontSize=s+"px";}}

/* render({ name, url, tagline?, template?(1-5), labels?(false hides "Template 0X"), mount? }) */
function render(o){
  o=o||{};
  var mount=o.mount||document.getElementById("row");
  if(typeof mount==="string")mount=document.querySelector(mount);
  mount.innerHTML="";
  var list=o.template?T.filter(function(t){return t.c==="t"+o.template;}):T;
  list.forEach(function(t){
    var col=document.createElement("div");col.className="col";
    col.innerHTML='<div class="card '+t.c+'">'+t.h+'</div>'+(o.labels===false?"":'<div class="lab '+t.l+'">'+t.n+'</div>');
    col.querySelector(".name").textContent=o.name;            /* textContent = safe injection */
    var tg=col.querySelector(".tag");
    if(tg){if(o.tagline)tg.textContent=o.tagline;else tg.remove();}
    mount.appendChild(col);
    new QRCode(col.querySelector(".qr"),{text:o.url,width:212,height:212,colorDark:"#0b1230",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});
  });
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){
    mount.querySelectorAll(".name,.tag").forEach(fit);
  });
}
window.TrustitCards={render:render};

/* Auto-run: data comes from window.TRUSTIT_CARD (set by portal) or URL ?name=&url=&tagline=&t=&labels=0 */
var q=new URLSearchParams(location.search),d=window.TRUSTIT_CARD||{};
var o={name:d.name||q.get("name"),url:d.url||q.get("url"),tagline:d.tagline||q.get("tagline")||"",
       template:d.template||q.get("t"),labels:d.labels!==undefined?d.labels:q.get("labels")!=="0"};
if(!o.name||!o.url){ /* demo preview only */
  o.name="Golden Blossom Cafe";o.url="https://example.com/r/golden-blossom-cafe";o.tagline=o.tagline||"Delicious Food, Happy People";
}
render(o);
})();
</script>
</body>
</html>
