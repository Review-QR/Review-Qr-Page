name: CI Quality Gate

on:
  push:
    branches:
      - main
      - nextjs-migration
      - codex/**
  pull_request:
    branches:
      - main
      - nextjs-migration
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Typecheck, Tests, Secret Scan & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan check
        run: pnpm audit:secrets

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run automated test suite
        run: pnpm test

      - name: Run Cashfree regression suite
        run: pnpm test:cashfree

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'placeholder-publishable-key' }}
        run: pnpm build
